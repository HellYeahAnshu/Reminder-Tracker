<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Priorities</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--muted:#77756e;--line:#e4e2da;--accent:#3b5bdb;--high:#e03131;--med:#f08c00;--low:#2f9e44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--text:#efeee9;--muted:#9a988f;--line:#333330;--accent:#748ffc}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 14px}
.add{display:flex;gap:8px;margin-bottom:14px}
input,select,button{font:inherit;color:inherit}
input[type=text]{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
select{padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--muted);padding:6px 8px;font-weight:500}
.subj{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.head{display:flex;align-items:center;gap:10px;padding:12px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.name{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted)}
.bar{height:4px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.body{padding:4px 12px 12px;border-top:1px solid var(--line)}
.ch{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.ch:last-of-type{border-bottom:0}
.ch input[type=checkbox]{width:20px;height:20px;flex:none}
.ch span{flex:1;overflow-wrap:anywhere}
.ch.done span{text-decoration:line-through;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;border:0;color:#fff}
.empty{text-align:center;color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<main>
<h1>📚 Study Priorities</h1>
<div class="add">
  <input type="text" id="sn" placeholder="Add a subject…">
  <select id="sp"><option value="1">High</option><option value="2" selected>Medium</option><option value="3">Low</option></select>
  <button id="sb">Add</button>
</div>
<div id="list"></div>
</main>
<script>
var KEY="study-priorities-v3",P={1:["High","var(--high)"],2:["Med","var(--med)"],3:["Low","var(--low)"]};
var data=[],open={};
var SEED=[["Geography","2027-02-25","B1 Human Geography: Nature and Scope|B1 The World Population|B1 Population Composition|B1 Human Development|B1 Primary Activities|B1 Secondary Activities|B1 Tertiary and Quaternary Activities|B1 Transport and Communication|B1 International Trade|B1 Human Settlements|B2 Population: Distribution, Density, Growth|B2 Human Settlements|B2 Land Resources and Agriculture|B2 Water Resources|B2 Mineral and Energy Resources|B2 Manufacturing Industries|B2 Planning and Sustainable Development|B2 Transport and Communication|B2 International Trade|B2 Selected Issues and Problems"],["English","2027-03-05","Reading Comprehension|Writing Skills (notice, letter, article, report)|Prose: The Last Lesson|Prose: Lost Spring|Prose: Deep Water|Prose: The Rattrap|Prose: Indigo|Prose: Poets and Pancakes|Prose: The Interview|Prose: Going Places|Poem: My Mother at Sixty-six|Poem: Keeping Quiet|Poem: A Thing of Beauty|Poem: A Roadside Stand|Poem: Aunt Jennifer’s Tigers|Vistas: The Third Level|Vistas: The Tiger King|Vistas: Journey to the End of the Earth|Vistas: The Enemy|Vistas: On the Face of It|Vistas: Memories of Childhood"],["Maths","2027-03-09","Relations and Functions|Inverse Trigonometric Functions|Matrices|Determinants|Continuity and Differentiability|Applications of Derivatives|Integrals|Applications of Integrals|Differential Equations|Vector Algebra|Three Dimensional Geometry|Linear Programming|Probability"],["Economics","2027-03-16","Macro: National Income Accounting|Macro: Money and Banking|Macro: Income and Employment Determination|Macro: Government Budget|Macro: Balance of Payments|Indian Economy at Independence|Development Experience 1950–90|Liberalisation, Privatisation, Globalisation|Poverty|Human Capital Formation|Rural Development|Employment|Sustainable Development|India and its Neighbours"],["History","2027-03-27","Bricks, Beads and Bones|Kings, Farmers and Towns|Kinship, Caste and Class|Thinkers, Beliefs and Buildings|Through the Eyes of Travellers|Bhakti-Sufi Traditions|An Imperial Capital: Vijayanagara|Peasants, Zamindars and the State|Kings and Chronicles|Colonialism and the Countryside|Rebels and the Raj|Colonial Cities|Mahatma Gandhi and the Nationalist Movement|Understanding Partition|Framing the Constitution"]];
try{data=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){data=null}
if(!data){data=SEED.map(function(x,i){return{id:"s"+i,n:x[0],p:2,d:x[1],ch:x[2].split("|").map(function(c,j){return{id:"c"+i+"-"+j,n:c,p:2,d:0}})}})}
function when(d){if(!d)return"";var t=new Date();t.setHours(0,0,0,0);var D=new Date(d+"T00:00:00"),n=Math.round((D-t)/864e5);return " · 📅 "+D.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+(n>=0?" ("+n+" days)":"")}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cyc(p){return p%3+1}
function render(){
  data.sort(function(a,b){return (a.p-b.p)||((a.d||"9")<(b.d||"9")?-1:1)});
  var h="";
  data.forEach(function(s){
    s.ch.sort(function(a,b){return (a.d-b.d)||(a.p-b.p)});
    var done=s.ch.filter(function(c){return c.d}).length,pct=s.ch.length?Math.round(done/s.ch.length*100):0;
    h+='<div class="subj"><div class="head"><span class="dot" style="background:'+P[s.p][1]+'"></span><div class="name" data-t="'+s.id+'">'+esc(s.n)+'<div class="sub">'+done+'/'+s.ch.length+' chapters · '+pct+'%'+when(s.d)+'</div></div><button class="pill" style="background:'+P[s.p][1]+'" data-sp="'+s.id+'">'+P[s.p][0]+'</button><button class="ghost" data-sd="'+s.id+'">✕</button></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
    if(open[s.id]){
      h+='<div class="body">';var rk=0;
      s.ch.forEach(function(c){
        h+='<div class="ch'+(c.d?' done':'')+'"><input type="checkbox" '+(c.d?'checked':'')+' data-cd="'+s.id+'|'+c.id+'"><span>'+(c.d?'':'<b>#'+(++rk)+'</b> ')+esc(c.n)+'</span><button class="ghost" data-mu="'+s.id+'|'+c.id+'">↑</button><button class="ghost" data-md="'+s.id+'|'+c.id+'">↓</button><button class="pill" style="background:'+P[c.p][1]+'" data-cp="'+s.id+'|'+c.id+'">'+P[c.p][0]+'</button><button class="ghost" data-cx="'+s.id+'|'+c.id+'">✕</button></div>';
      });
      h+='<div class="add" style="margin:10px 0 0"><input type="text" id="cn-'+s.id+'" placeholder="Add a chapter…"><select id="cp-'+s.id+'"><option value="1">High</option><option value="2" selected>Medium</option><option value="3">Low</option></select><button data-ca="'+s.id+'">Add</button></div></div>';
    }
    h+='</div>';
  });
  document.getElementById("list").innerHTML=h||'<div class="empty">No subjects yet.<br>Add your first one above.</div>';
}
function find(id){return data.filter(function(s){return s.id===id})[0]}
function addSubject(){
  var i=document.getElementById("sn"),n=i.value.trim();if(!n)return;
  var s={id:uid(),n:n,p:+document.getElementById("sp").value,ch:[]};
  data.push(s);open[s.id]=true;i.value="";save();render();
}
document.getElementById("sb").onclick=addSubject;
document.getElementById("sn").onkeydown=function(e){if(e.key==="Enter")addSubject()};
document.getElementById("list").addEventListener("click",function(e){
  var t=e.target,d=t.dataset,s,c,a;
  if(d.sp){s=find(d.sp);s.p=cyc(s.p)}
  else if(d.sd){if(!confirm("Delete this subject and its chapters?"))return;data=data.filter(function(x){return x.id!==d.sd})}
  else if(d.mu||d.md){a=(d.mu||d.md).split("|");s=find(a[0]);var ii=s.ch.findIndex(function(x){return x.id===a[1]}),jj=d.mu?ii-1:ii+1;if(jj<0||jj>=s.ch.length||s.ch[jj].d!==s.ch[ii].d)return;var tmp=s.ch[ii];s.ch[ii]=s.ch[jj];s.ch[jj]=tmp;tmp.p=s.ch[ii].p}
  else if(d.cp){a=d.cp.split("|");c=find(a[0]).ch.filter(function(x){return x.id===a[1]})[0];c.p=cyc(c.p)}
  else if(d.cx){a=d.cx.split("|");s=find(a[0]);s.ch=s.ch.filter(function(x){return x.id!==a[1]})}
  else if(d.ca){s=find(d.ca);var n=document.getElementById("cn-"+d.ca).value.trim();if(!n)return;s.ch.push({id:uid(),n:n,p:+document.getElementById("cp-"+d.ca).value,d:0})}
  else if(t.closest&&t.closest("[data-t]")){var id=t.closest("[data-t]").dataset.t;open[id]=!open[id]}
  else return;
  save();render();
});
document.getElementById("list").addEventListener("change",function(e){
  var d=e.target.dataset.cd;if(!d)return;
  var a=d.split("|"),c=find(a[0]).ch.filter(function(x){return x.id===a[1]})[0];
  c.d=e.target.checked?1:0;save();render();
});
document.getElementById("list").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id&&e.target.id.indexOf("cn-")===0){
    var b=document.querySelector('[data-ca="'+e.target.id.slice(3)+'"]');if(b)b.click();
  }
});
render();
</script>
</body>
</html>
